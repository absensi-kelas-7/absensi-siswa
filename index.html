<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi 7D - Auto Gmail</title>
<style>
body{font-family:sans-serif;background:#f0f4ff;margin:0;padding:15px}
.card{background:white;padding:20px;border-radius:15px;max-width:400px;margin:auto}
h2{text-align:center;color:#2b5cff}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
button{width:100%;padding:12px;border:none;border-radius:8px;background:#2b5cff;color:white;font-weight:bold;font-size:16px;margin-top:10px}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status-btn{padding:12px;border-radius:8px;border:2px solid #eee;background:#f9f9f9;cursor:pointer;text-align:center}
.status-btn.active{background:#2b5cff;color:white}
.item{background:#f9fbff;padding:10px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="card">
<h2>ABSENSI 7D</h2>
<input id="nama" placeholder="Nama lengkap">
<select id="kelas"><option>7D</option><option>7D</option><option>7B</option></select>
<div class="status-grid">
<div class="status-btn" data-v="Hadir">Hadir</div>
<div class="status-btn" data-v="Sakit">Sakit</div>
<div class="status-btn" data-v="Izin">Izin</div>
<div class="status-btn" data-v="Alpa">Alpa</div>
</div>
<button onclick="kirim()">KIRIM KE GMAIL</button>
<p id="msg" style="text-align:center;color:green"></p>
<div id="list"></div>
</div>
<script>
let statusPilih="", dataAbsen=JSON.parse(localStorage.getItem("absen7D")||"[]");
document.querySelectorAll(".status-btn").forEach(b=>{
 b.onclick=()=>{document.querySelectorAll(".status-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");statusPilih=b.dataset.v;}
});
function render(){document.getElementById("list").innerHTML=dataAbsen.map((d,i)=>`<div class="item"><span><b>${d.nama}</b> ${d.kelas} - ${d.status}<br><small>${d.tanggal}</small></span><span onclick="hapus(${i})" style="color:red">X</span></div>`).join("");}
render();
function hapus(i){dataAbsen.splice(i,1);localStorage.setItem("absen7D",JSON.stringify(dataAbsen));render();}
async function kirim(){
 let nama=document.getElementById("nama").value.trim();
 let kelas=document.getElementById("kelas").value;
 if(!nama||!statusPilih){alert("Isi nama dan status dulu");return;}
 let tanggal=new Date().toLocaleString("id-ID");
 dataAbsen.unshift({nama,kelas,status:statusPilih,tanggal});
 localStorage.setItem("absen7D",JSON.stringify(dataAbsen));render();
 document.getElementById("msg").innerText="Mengirim ke doyzzkaciw@gmail.com...";
 await fetch("https://formsubmit.co/ajax/doyzzkaciw@gmail.com",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subject:`ABSEN: ${nama} - ${statusPilih}`,Nama:nama,Kelas:kelas,Status:statusPilih,Tanggal:tanggal})});
 document.getElementById("msg").innerText="✅ Terkirim ke Gmail!";
 document.getElementById("nama").value="";
}
</script>
</body>
</html>
