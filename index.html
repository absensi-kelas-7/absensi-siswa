<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEVENNDE GRAFFITI </title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Impact,Arial Black}
body{min-height:100vh;background:#000;display:flex;justify-content:center;padding:12px}
#bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#6a2cff,#1a0a3a,#000);z-index:0;animation:hue 8s infinite alternate}
@keyframes hue{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(30deg)}}
#blur{position:fixed;inset:0;backdrop-filter:blur(28px);background:rgba(0,0,0,0.5);z-index:1}
#wrap{position:relative;z-index:10;width:100%;max-width:520px}
#card{background:white;border-radius:26px;overflow:hidden;border:4px solid black;box-shadow:0 0 40px rgba(106,44,255,0.6),0 20px 60px rgba(0,0,0,0.8);transform:rotate(-0.5deg)}
#top{background:#e10600;padding:16px 15px 8px;text-align:center;position:relative}
#top h1{color:white;font-size:50px;letter-spacing:4px;line-height:1;text-shadow:2px 2px 0 rgba(0,0,0,0.3)}
#top p{color:white;font-size:15px;letter-spacing:3px;margin-top:2px}
#spray{position:absolute;left:50%;top:72%;transform:translateX(-50%);width:170px;height:16px;background:#9e0000;border-radius:50%;filter:blur(3px)}
#mid{background:white;padding:18px 15px;min-height:140px;display:flex;align-items:center;justify-content:center;position:relative;border-top:4px solid black;border-bottom:4px solid black}
#graffiti{font-family:Impact; font-size:52px; line-height:0.85; color:#4b1fa7; text-transform:lowercase; transform:rotate(-3deg) skew(-6deg); text-shadow:3px 3px 0 #fff, 7px 7px 0 #2a0f5e, 0 0 25px rgba(75,31,167,0.7); text-align:center}
#angkatan{position:absolute;right:6px;top:10px;writing-mode:vertical-rl;font-size:10px;letter-spacing:3px;font-weight:900}
#content{padding:14px;background:#f5f5f5;max-height:68vh;overflow-y:auto}
#nama{width:100%;padding:12px;border:3px solid black;border-radius:12px;font-family:Arial Black;font-size:13px;margin-bottom:10px}
.month{margin-bottom:14px;background:white;border:2.5px solid black;border-radius:14px;padding:10px}
.month h3{background:black;color:white;padding:4px 12px;border-radius:20px;font-size:11px;display:inline-block;margin-bottom:8px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.d{border:1.5px solid #ddd;border-radius:8px;padding:5px 1px;text-align:center;font-size:10px;cursor:pointer}
.d.head{border:none;color:#888;font-size:8px}
.d.done{background:#4b1fa7;color:white;border-color:#4b1fa7;box-shadow:0 0 10px #4b1fa7}
.d.today{border-color:#e10600;background:#e10600;color:white;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#btns{display:flex;gap:8px;position:sticky;bottom:0;background:#f5f5f5;padding-top:10px}
.btn{flex:1;padding:14px;border:3px solid black;border-radius:30px;font-weight:900;cursor:pointer;font-size:13px}
#kirim{background:linear-gradient(90deg,#4b1fa7,#e10600);color:white;box-shadow:0 6px 20px rgba(75,31,167,0.5)}
#reset{background:black;color:white}
</style>
</head>
<body>
<div id="bg"></div>
<div id="blur"></div>
<div id="wrap">
<div id="card">
  <div id="top"><h1>HELLO</h1><p>MY CLASS</p><div id="spray"></div></div>
  <div id="mid"><div id="graffiti">sevennde<br>smp kuba</div><div id="angkatan">ANGKATAN 2026</div></div>
  <div style="background:#e10600;height:22px;border-top:4px solid black"></div>
  <div id="content">
    <input id="nama" placeholder="NAMA LU (contoh: Doyz - 7D)">
    <div id="list"></div>
    <div id="btns">
      <button class="btn" id="reset">RESET</button>
      <button class="btn" id="kirim">📧 KIRIM ABSEN</button>
    </div>
    <p style="font-family:Arial;font-size:9px;text-align:center;margin-top:8px;color:#666">AUTO KIRIM KE: doyzzkaciw@gmail.com • ABSEN SEP 2026 - JULI 2027</p>
  </div>
</div>
</div>

<script>
let list=document.getElementById('list');
let data=JSON.parse(localStorage.getItem('smrkubaGraffitiJuli')||'{}');
let start=new Date();
let end=new Date(2027,6,31);

function render(){
  list.innerHTML='';
  let cur=new Date(start.getFullYear(),start.getMonth(),1);
  let today=new Date().toISOString().slice(0,10);
  while(cur<=end){
    let y=cur.getFullYear(), m=cur.getMonth();
    let box=document.createElement('div'); box.className='month';
    box.innerHTML=`<h3>${cur.toLocaleDateString('id-ID',{month:'long',year:'numeric'}).toUpperCase()}</h3><div class="grid"></div>`;
    let grid=box.querySelector('.grid');
    ['Mg','Sn','Sl','Rb','Km','Jm','Sb'].forEach(h=>{let d=document.createElement('div');d.className='d head';d.innerText=h;grid.appendChild(d);});
    let first=new Date(y,m,1).getDay();
    for(let i=0;i<first;i++) grid.appendChild(document.createElement('div'));
    let total=new Date(y,m+1,0).getDate();
    for(let d=1;d<=total;d++){
      let str=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      let el=document.createElement('div'); el.className='d';
      if(data[str]) el.classList.add('done');
      if(str==today) el.classList.add('today');
      el.innerHTML=`${d}<br>${data[str]?'✅':'⚪'}`;
      el.onclick=()=>{data[str]=!data[str]; if(!data[str]) delete data[str]; localStorage.setItem('smrkubaGraffitiJuli',JSON.stringify(data)); render(); if(navigator.vibrate) navigator.vibrate(25);};
      grid.appendChild(el);
    }
    list.appendChild(box);
    cur.setMonth(cur.getMonth()+1);
  }
}

document.getElementById('kirim').onclick=async()=>{
  let nama=document.getElementById('nama').value||'SEVENNDE SMRKUBA';
  let hadir=Object.keys(data).filter(k=>data[k]).sort();
  let txt=`ABSEN GRAFFITI SEVENNDE SMRKUBA\nNama: ${nama}\nTotal Hadir: ${hadir.length} hari\nPeriode: Sep 2026 - Juli 2027\n\nDaftar Hadir:\n${hadir.join('\n')}\n\nWaktu Kirim: ${new Date().toLocaleString('id-ID')}`;
  let btn=document.getElementById('kirim'); btn.innerText='MENGIRIM...'; btn.disabled=true;
  try{
    await fetch('https://formsubmit.co/ajax/doyzzkaciw@gmail.com',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:`[ABSEN GRAFFITI] ${nama} - ${hadir.length} hari`,message:txt,_captcha:'false'})});
    alert('✅ GRAFFITI ABSEN BERHASIL TERKIRIM KE\n\ndoyzzkaciw@gmail.com\n\nCek inbox Gmail lu pung!');
    btn.innerText='✅ TERKIRIM';
  }catch{
    window.location.href=`mailto:doyzzkaciw@gmail.com?subject=ABSEN GRAFFITI ${encodeURIComponent(nama)}&body=${encodeURIComponent(txt)}`;
    btn.innerText='📧 BUKA GMAIL';
  }
  setTimeout(()=>{btn.innerText='📧 KIRIM KE GMAIL';btn.disabled=false;},3000);
};

document.getElementById('reset').onclick=()=>{if(confirm('Reset absen graffiti sampe Juli?')){localStorage.removeItem('smrkubaGraffitiJuli');data={};render();}};
render();
</script>
</body>
</html>
