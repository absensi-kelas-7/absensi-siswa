<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absen Kelas 7 Lengkap</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f0f] text-white min-h-screen p-4">
<div class="max-w-md mx-auto w-full">
  <div class="bg-purple-600 rounded-[24px] p-6 text-center">
    <h1 class="text-2xl font-bold">📋 ABSEN KELAS 7</h1>
    <p id="tgl" class="text-sm mt-1 opacity-80"></p>
    <div class="mt-2 bg-black/20 rounded-full px-3 py-1 text-[11px] inline-block">Grup: 7A - 7D</div>
  </div>

  <div class="bg-zinc-900 rounded-2xl p-5 mt-4 border border-zinc-800 space-y-3">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-[11px] text-zinc-400">Nama Siswa</label>
        <input id="nama" type="text" placeholder="Nama siswa..." class="w-full mt-1 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-3 text-sm outline-none focus:border-purple-500">
      </div>
      <div>
        <label class="text-[11px] text-zinc-400">Kelas</label>
        <select id="kelas" class="w-full mt-1 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-3 text-sm outline-none">
          <option>7A</option><option>7B</option><option>7C</option><option>7D</option>
        </select>
      </div>
    </div>
    <div>
      <label class="text-[11px] text-zinc-400">Status</label>
      <div class="grid grid-cols-2 gap-2 mt-1">
        <label><input type="radio" name="status" value="Sakit" checked class="peer hidden"><div class="peer-checked:bg-yellow-600 bg-zinc-800 border border-zinc-700 rounded-xl py-3 text-center text-sm font-bold cursor-pointer">🤒 Sakit</div></label>
        <label><input type="radio" name="status" value="Izin" class="peer hidden"><div class="peer-checked:bg-blue-600 bg-zinc-800 border border-zinc-700 rounded-xl py-3 text-center text-sm font-bold cursor-pointer">📝 Izin</div></label>
      </div>
    </div>
    <button onclick="tambah()" class="w-full bg-purple-600 font-bold py-3 rounded-xl text-sm active:scale-95">+ TAMBAH KE DAFTAR</button>
  </div>

  <div class="grid grid-cols-2 gap-2 mt-4 text-[10px] text-center">
    <div class="bg-yellow-500/20 border border-yellow-500/30 text-yellow-400 py-2 rounded-xl">Sakit<br><b id="cS" class="text-sm">0</b></div>
    <div class="bg-blue-500/20 border border-blue-500/30 text-blue-400 py-2 rounded-xl">Izin<br><b id="cI" class="text-sm">0</b></div>
  </div>

  <div id="list" class="space-y-2 mt-4"></div>

  <button onclick="kirim()" class="w-full mt-6 bg-green-500 font-bold py-5 rounded-2xl text-lg active:scale-95 transition">
    📤 KIRIM ABSEN 🤧
  </button>
  <button onclick="resetAll()" class="w-full mt-2 text-zinc-600 text-[11px] py-2">Reset Semua</button>
</div>

<script>
const LINK_GRUP = "https://chat.whatsapp.com/CAckr81mrKSHL6nh7YpV79";
let data = [];
document.getElementById('tgl').innerText = new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
function tambah(){
  let nama = document.getElementById('nama').value.trim();
  let kelas = document.getElementById('kelas').value;
  let status = document.querySelector('input[name="status"]:checked').value;
  if(!nama) return alert('Isi nama dulu pung!');
  data.push({nama, kelas, status});
  document.getElementById('nama').value='';
  render();
}
function render(){
  let list = document.getElementById('list');
  list.innerHTML='';
  let S=0,I=0;
  data.forEach((d,i)=>{
    if(d.status=='Sakit')S++; if(d.status=='Izin')I++;
    let color = d.status=='Sakit'?'text-yellow-400':'text-blue-400';
    list.innerHTML+=`<div class="flex justify-between items-center bg-zinc-900 p-3 rounded-xl border border-zinc-800"><div><p class="text-sm font-bold">${d.nama} <span class="text-zinc-500 font-normal">${d.kelas}</span></p><p class="text-[11px] ${color}">${d.status}</p></div><button onclick="hapus(${i})" class="bg-zinc-800 px-3 py-1 rounded-full text-xs">✕</button></div>`;
  });
  document.getElementById('cS').innerText=S; document.getElementById('cI').innerText=I;
}
function hapus(i){ data.splice(i,1); render(); }
function resetAll(){ if(confirm('Hapus semua?')){ data=[]; render(); } }
function kirim(){
  if(data.length==0) return alert('Tambah siswa dulu pung!');
  let tgl = new Date().toLocaleDateString('id-ID');
  let S = data.filter(d=>d.status=='Sakit');
  let I = data.filter(d=>d.status=='Izin');
  let pesan = `*📋 ABSENSI KELAS 7 (7A-7D)*\n📅 ${tgl}\n━━━━━━━━━━━━\n\n🤒 SAKIT (${S.length}): ${S.map(d=>d.nama+'-'+d.kelas).join(', ')||'-'}\n📝 IZIN (${I.length}): ${I.map(d=>d.nama+'-'+d.kelas).join(', ')||'-'}`;
  navigator.clipboard.writeText(pesan).then(()=>{ window.open(LINK_GRUP, '_blank'); });
}
</script>
</body>
</html>
