<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absen Kelas 7 - Kirim Grup WA</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f0f] text-white min-h-screen p-4 flex items-center">
<div class="max-w-md mx-auto w-full">
  <div class="bg-purple-600 rounded-[24px] p-8 text-center">
    <h1 class="text-2xl font-bold">📋 ABSEN KELAS 7</h1>
    <p id="tgl" class="text-sm mt-2 opacity-80"></p>
    <div class="mt-3 bg-green-500 rounded-full px-3 py-1 text-xs inline-block">✅ TERHUBUNG KE GRUP WA</div>
  </div>

  <div class="bg-zinc-900 rounded-2xl p-5 mt-4 border border-zinc-800">
    <label class="text-xs text-zinc-400">Catatan / Keterangan (opsional)</label>
    <textarea id="catatan" placeholder="Contoh: Hari ini semua hadir..." class="w-full mt-2 bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-sm h-24 outline-none"></textarea>
  </div>

  <button onclick="kirim()" class="w-full mt-5 bg-green-500 font-bold py-5 rounded-2xl text-lg active:scale-95 transition shadow-lg shadow-green-900/30">
    📤 KIRIM ABSEN🤧
  </button>
  <p class="text-center text-[11px] text-zinc-600 mt-3">Langsung kirim ke Grup WA Kelas 7</p>
</div>

<script>
const LINK_GRUP = "https://chat.whatsapp.com/CAckr81mrKSHL6nh7YpV79";
document.getElementById('tgl').innerText = new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

function kirim(){
  let tgl = new Date().toLocaleDateString('id-ID');
  let jam = new Date().toLocaleTimeString('id-ID');
  let catatan = document.getElementById('catatan').value || "Absen hari ini selesai.";

  let pesan = `*📋 ABSENSI KELAS 7*\n📅 ${tgl} | 🕐 ${jam}\n━━━━━━━━━━━━\n\n${catatan}\n\n_Dikirim dari absensi-kelas-7.github.io_`;

  navigator.clipboard.writeText(pesan);
  window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`, '_blank');
  setTimeout(()=>{ window.open(LINK_GRUP, '_blank'); }, 800);
}
</script>
</body>
</html>
