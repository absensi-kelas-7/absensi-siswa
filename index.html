<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEVENNDE SMRKUBA - 7D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Impact,Arial Black,sans-serif}
body{height:100vh;width:100vw;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at center,#4b1fa7,#1a0a3a);animation:bgmove 6s infinite alternate}
@keyframes bgmove{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(40deg)}}
#blur{position:fixed;top:0;left:0;width:100%;height:100%;backdrop-filter:blur(30px);background:rgba(0,0,0,0.3)}

/* Nametag Style kayak foto lu */
#card{position:relative;z-index:10;width:96vw;max-width:520px;background:white;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.7);transform:rotate(-1deg);animation:float 3s infinite ease-in-out}
@keyframes float{0%,100%{transform:rotate(-1deg) translateY(0)}50%{transform:rotate(1deg) translateY(-8px)}}
#top-red{background:#e10600;padding:18px 20px 10px;text-align:center;position:relative}
#top-red h1{color:white;font-size:54px;letter-spacing:4px;line-height:1;margin:0;text-shadow:2px 2px 0 rgba(0,0,0,0.2)}
#top-red p{color:white;font-size:18px;margin-top:2px;letter-spacing:2px;font-family:Arial Black}
#spray{position:absolute;left:50%;top:68%;transform:translateX(-50%);width:180px;height:18px;background:#a80000;border-radius:50%;filter:blur(3px);opacity:0.8}

#mid{padding:15px 20px 10px;background:white;position:relative;min-height:160px;display:flex;align-items:center;justify-content:center}
#graffiti{font-family:Impact; font-size:52px; line-height:0.85; color:#4b1fa7; text-transform:lowercase; transform:rotate(-3deg) skew(-5deg); text-shadow:3px 3px 0 #fff, 6px 6px 0 #2a0f5e, 0 0 20px rgba(75,31,167,0.5); letter-spacing:-1px; text-align:center}
#angkatan{position:absolute;right:10px;top:15px;writing-mode:vertical-rl;font-size:11px;letter-spacing:3px;font-family:Arial Black;color:#111;font-weight:900}
#bottom-red{background:#e10600;height:26px;border-radius:0 0 28px 28px;width:100%}

#absen-area{padding:20px;background:#f8f8ff}
#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{background:white;border:2px solid #e10600;border-radius:14px;padding:10px 2px;text-align:center;transition:0.4s;transform:scale(0);animation:pop 0.5s forwards;cursor:pointer}
.day:nth-child(1){animation-delay:0.1s}.day:nth-child(2){animation-delay:0.2s}.day:nth-child(3){animation-delay:0.3s}.day:nth-child(4){animation-delay:0.4s}.day:nth-child(5){animation-delay:0.5s}.day:nth-child(6){animation-delay:0.6s}.day:nth-child(7){animation-delay:0.7s}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.day.active{background:#e10600;color:white;transform:scale(1.1)!important;box-shadow:0 5px 15px rgba(225,6,0,0.4);animation:pulse 1s infinite}
.day.done{background:#4b1fa7;color:white;border-color:#4b1fa7;box-shadow:0 0 15px #4b1fa7}
@keyframes pulse{0%,100%{transform:scale(1.1)}50%{transform:scale(1.15)}}
.day b{font-size:18px;display:block}.day span{font-size:9px}

#btn{width:100%;margin-top:15px;padding:16px;background:#111;color:white;border:none;border-radius:50px;font-size:16px;font-weight:900;letter-spacing:2px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,0.3);transition:0.2s}
#btn:active{transform:scale(0.95)}
#btn.done{background:#4b1fa7}
#bar{height:8px;background:#eee;border-radius:10px;margin-top:12px;overflow:hidden}
#fill{height:100%;width:0%;background:linear-gradient(90deg,#e10600,#4b1fa7);transition:1s}
</style>
</head>
<body>
<div id="bg"></div>
<div id="blur"></div>

<div id="card">
  <div id="top-red">
    <h1>HELLO</h1>
    <p>MY CLASS</p>
    <div id="spray"></div>
  </div>
  <div id="mid">
    <div id="graffiti">sevennde<br>smrkuba</div>
    <div id="angkatan">ANGKATAN 2026</div>
  </div>
  <div id="bottom-red"></div>
  
  <div id="absen-area">
    <div id="grid"></div>
    <button id="btn">ABSEN HARI INI 👇</button>
    <div id="bar"><div id="fill"></div></div>
    <p style="text-align:center;font-family:sans-serif;font-size:11px;margin-top:8px;color:#666">Streak: <span id="st">0</span>/7 • SEVENNDE SMRKUBA</p>
  </div>
</div>

<script>
let days=["SEN","SEL","RAB","KAM","JUM","SAB","MIN"];
let data=JSON.parse(localStorage.getItem('smrkuba7d')||'[]');
let grid=document.getElementById('grid');
function render(){
  grid.innerHTML='';
  for(let i=0;i<7;i++){
    let d=document.createElement('div'); d.className='day';
    if(data.includes(i)) d.classList.add('done');
    if(i==data.length && data.length<7) d.classList.add('active');
    d.innerHTML=`<b>${i+1}</b><span>${days[i]}</span><div style="margin-top:3px;font-size:16px">${data.includes(i)?'✅':i==data.length?'🔥':'🔒'}</div>`;
    grid.appendChild(d);
  }
  document.getElementById('fill').style.width=(data.length/7*100)+'%';
  document.getElementById('st').innerText=data.length;
  let b=document.getElementById('btn');
  if(data.length>=7){b.innerText='🎉 TAMAT 7D ANGKATAN 2026!'; b.classList.add('done'); b.disabled=true;}
  else b.innerText=`ABSEN HARI ${data.length+1} 🔥`;
}
document.getElementById('btn').onclick=()=>{
  if(data.length>=7) return;
  data.push(data.length);
  localStorage.setItem('smrkuba7d',JSON.stringify(data));
  if(navigator.vibrate) navigator.vibrate([40,20,40]);
  document.getElementById('card').animate([{transform:'scale(1) rotate(-1deg)'},{transform:'scale(1.05) rotate(1deg)'},{transform:'scale(1) rotate(-1deg)'}],{duration:300});
  render();
};
render();
</script>
</body>
</html>
