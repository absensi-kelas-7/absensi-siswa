<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absen Kelas 7 - Auto</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f0f] text-white min-h-screen p-4">
<div class="max-w-md mx-auto w-full">
  <div class="bg-purple-600 rounded-[24px] p-6 text-center">
    <h1 class="text-2xl font-bold">📋 ABSEN KELAS 7</h1>
    <p id="tgl" class="text-sm mt-1 opacity-80"></p>
  </div>

  <div class="bg-zinc-900 rounded-2xl p-5 mt-4 border border-zinc-800 space-y-3">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-[11px] text-zinc-400">Nama Siswa</label>
        <input id="nama" type="text" placeholder="Nama siswa..." class="w-full mt-1 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-3 text-sm outline-none focus:border-purple-500">
      </div>
      <div>
        <label class="text-[11px] text-zinc-400">Kelas</label>
        <select id="kelas" class="w-full mt-1 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-3 text-sm outline-none">
          <option>7A</option><option>7B</option><option>7C</option><option>7D</option>
        </select>
      </div>
    </div>
    <div>
      <label class="text-[11px] text-zinc-400">Status</label>
      <div class="grid grid-cols-2 gap-2 mt-1">
        <label><input type="radio" name="status" value="Sakit" checked class="peer hidden"><div class="peer-checked:bg-yellow-600 bg-zinc-800 border border-zinc-700 rounded-xl py-3 text-center text-sm font-bold cursor-pointer">🤒 Sakit</div></label>
        <label><input type="radio" name="status" value="Izin" class="peer hidden"><div class="peer-checked:bg-blue-600 bg-zinc-800 border border-zinc-700 rounded-xl py-3 text-center text-sm font-bold cursor-pointer">📝 Izin</div></label>
      </div>
    </div>
    <button onclick="tambah()" class="w-full bg-zinc-800 font-bold py-3 rounded-xl text-sm border border-zinc-700">+ TAMBAH KE DAFTAR</button>
  </div>

  <div id="list" class="space-y-2 mt-4"></div>
  <div class="text-center text-[11px] text-zinc-500 mt-3">Total: <b id="total" class="text-white">0</b> siswa</div>

  <button onclick="kirim()" class="w-full mt-4 bg-green-500 font-bold py-5 rounded-2xl text-lg active:scale-95">
    📤 KIRIM OTOMATIS KE WA
  </button>
  <p class="text-center text-[10px] text-zinc-500 mt-2">Teks udah keisi otomatis, lu tinggal tap KIRIM di WA</p>
  <button onclick="resetAll()" class="w-full mt-2 text-zinc-600 text-[11px] py-2">Reset Semua</button>
</div>

<script>
const LINK_GRUP = "https://chat.whatsapp.com/Ix9OeiN9pbgF0KwvXJZ5Wc";
let data = [];
document.getElementById('tgl').innerText = new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric',
      function kirim(){
  let tgl = new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  
  // KALO LUPA TAMBAH KE DAFTAR, AMBIL LANGSUNG DARI FORM
  if(data.length==0){
    let nama = document.getElementById('nama').value.trim();
    let kelas = document.getElementById('kelas').value;
    let status = document.querySelector('input[name="status"]:checked').value;
    if(!nama) return alert('Isi nama dulu pung!');
    data.push({nama, kelas, status});
  }

  let listGabung = data.map((d,i)=> `${i+1}. ${d.nama} - ${d.kelas} (${d.status})`).join('\n');
  let pesan = `📋 *ABSENSI KELAS 7 (7A-7D)*\n📅 ${tgl}\n━━━━━━━━━━━━\n\n📝 *DAFTAR TIDAK MASUK (${data.length} siswa):*\n${listGabung}`;
  navigator.clipboard.writeText(pesan).then(()=>{ window.open(LINK_GRUP, '_blank'); });
                                                                                   }
